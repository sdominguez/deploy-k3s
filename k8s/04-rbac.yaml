apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: laboratorio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lector-pods
  namespace: laboratorio
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-lector
  namespace: laboratorio
subjects:
  - kind: ServiceAccount
    name: auditor
    namespace: laboratorio
roleRef:
  kind: Role
  name: lector-pods
  apiGroup: rbac.authorization.k8s.io
